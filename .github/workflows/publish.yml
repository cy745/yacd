# ─────────────────────────────────────────────────────────────
#  发布 yacd SPA 到 GitHub Pages 根路径
#  (master/主分支推送时构建前端 → 推送到 gh-pages 分支根目录)
#  docs/ 子目录由 release.yml 的 docs job 负责,二者互不冲突
# ─────────────────────────────────────────────────────────────
name: Publish SPA

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  publish-spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Build SPA
        run: pnpm build

      - name: Deploy to gh-pages (root)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
          clean: true
          # 保留 docs/ 子目录(由 release.yml 的 docs job 维护,勿被 SPA 发布清空)
          clean-exclude: |
            docs
