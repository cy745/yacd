# ─────────────────────────────────────────────────────────────
#  yacd Release:tag v* 触发
#  1) 构建前端 → 生成 release 资产 yacd-release.tar.gz(供 curl|sh 安装)
#  2) 发布多架构镜像(Docker Hub + GHCR)
#  3) 构建文档站并推送到 gh-pages 分支 docs/ 子目录
# ─────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── 前端构建 + release 资产 ──────────────────────────────────
  build-and-release:
    name: Build frontend + release asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2.4.0
        with:
          version: 8
          run_install: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: 打包 release 资产(供无 git 的 NAS 一键安装)
        run: |
          mkdir -p dist-release
          cp -r deploy docker server public dist-release/
          echo "${{ steps.version.outputs.VERSION }}" > dist-release/deploy/VERSION
          cp CHANGELOG.md dist-release/ 2>/dev/null || true
          tar czf yacd-release.tar.gz -C dist-release .
          ls -lh yacd-release.tar.gz

      - name: 创建/更新 Release
        uses: softprops/action-gh-release@v2
        with:
          name: yacd v${{ steps.version.outputs.VERSION }}
          body: |
            yacd ${{ steps.version.outputs.VERSION }}

            一键安装:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/cy745/yacd/${{ github.ref_name }}/deploy/install.sh | sh
            ```
          files: yacd-release.tar.gz

      - name: 上传构建产物(docker-push 复用)
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 1

  # ── 多架构镜像发布 ───────────────────────────────────────────
  docker-push:
    name: Build & push multi-arch images
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public/

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/cy745/yacd
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha

  # ── 文档站 → gh-pages 分支 docs/ 子目录 ─────────────────────
  docs:
    name: Build & deploy docs (VitePress)
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2.4.0
        with:
          version: 8
          run_install: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Build docs
        run: pnpm docs:build

      - name: Deploy to gh-pages (docs/ subdir)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/.vitepress/dist
          branch: gh-pages
          target-folder: docs
          clean: true
