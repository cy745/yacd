# ─────────────────────────────────────────────────────────────
#  yacd + mihomo 组合容器编排
#
#  架构:macvlan 网络 + 局域网固定 IP + TUN 透明代理
#  - 容器通过 macvlan 网络获得局域网 IP,作为旁路由代理网关
#  - 依赖外部 macvlan 网络(manage.sh up 会自动创建)
#  - 数据保存在命名卷 mihomo-config,重建/删除容器不清空配置
#
#  用法(推荐通过 manage.sh):
#    ./manage.sh up        # 一键启动(自动创建网络/构建镜像/启动容器)
#    ./manage.sh rebuild   # 重建容器(数据保留)
# ─────────────────────────────────────────────────────────────

services:
  mihomo:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${IMAGE_NAME:-yacd-mihomo:latest}
    container_name: ${CONTAINER_NAME:-yacd-mihomo}
    # 自行重启:容器退出后自动拉起(除非手动 stop)
    restart: unless-stopped
    networks:
      macnet:
        # 固定局域网 IP(旁路由网关/DNS 指向此地址)
        ipv4_address: ${MIHOMO_IP:-192.168.3.100}
    # TUN 透明代理所需的三个 capability(缺 SYS_ADMIN 则 TUN 无法建虚拟网卡)
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # 命名卷:配置持久化,重建容器时保留
    volumes:
      - mihomo-config:/root/.config/mihomo
    environment:
      - PORT=${PORT:-80}
      - MIHOMO_TARGET=${MIHOMO_TARGET:-http://127.0.0.1:9090}

volumes:
  mihomo-config:
    # 命名卷:首次 up 自动创建;重建/删除容器时数据保留
    name: mihomo-config

networks:
  macnet:
    # 外部网络:由 manage.sh 先创建(macvlan 需指定 parent 网卡)
    external: true
    name: ${NETWORK_NAME:-macnet}
